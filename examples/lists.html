<html>
<head>
    <title>TurtleGUI - Lists Example</title>
</head>

<link rel="stylesheet" type="text/css" href="../turtlegui.css"/>
<style>
.ingredient-row {
    padding: 5px;
    margin: 5px 0;
    border: 1px solid #ccc;
}

.remove-button {
    margin-left: 10px;
    cursor: pointer;
    color: red;
    font-weight: bold;
}

.add-section {
    margin-top: 20px;
    padding: 10px;
    border-top: 2px solid #333;
}
</style>

<script src="../turtlegui.js"></script>

<script>

// Controller code / state
var data = {
    ingredients: [
        {name: "Flour", amount: 4},
        {name: "Butter", amount: 1},
        {name: "Eggs", amount: 2},
        {name: "Vanilla", amount: 1},
        {name: "Apple", amount: 4}
    ]
}

var recipe = {
    new_ingredient: {
        name: null
    },
    add_ingredient: function() {
        data.ingredients[data.ingredients.length] = {
            name: recipe.new_ingredient.name,
            amount: 1
        };
        recipe.new_ingredient.name = null;
        turtlegui.reload();
    },
    remove_ingredient: function(ingredient) {
        data.ingredients.splice(data.ingredients.indexOf(ingredient), 1);
        turtlegui.reload();
    }
}

document.addEventListener("DOMContentLoaded", function(){
    // call turtlegui.reload() when the page loads
    turtlegui.reload();
});

</script>

<body>
<h2>Recipe Ingredients</h2>
<p>This example demonstrates using gui-list to display and modify a list of items.</p>

<div gui-list="data.ingredients" gui-item="ingredient">
    <div class="ingredient-row">
        <span gui-text="ingredient.name"></span>
        <span> - Amount: </span>
        <span gui-text="ingredient.amount"></span>
        <span class="remove-button" gui-click="recipe.remove_ingredient(ingredient)">&times;</span>
    </div>
</div>

<div class="add-section">
    <label>Add new ingredient:</label>
    <input type="text" gui-val="recipe.new_ingredient.name" placeholder="Ingredient name">
    <button gui-click="recipe.add_ingredient()">Add</button>
</div>

</body>
