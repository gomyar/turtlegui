<html>
<head>
    <title>TurtleGUI - Events Example</title>
</head>

<link rel="stylesheet" type="text/css" href="../turtlegui.css"/>
<style>
.info-section {
    margin-top: 20px;
    padding: 10px;
    border: 1px solid #ccc;
}

.info-label {
    font-weight: bold;
    display: inline-block;
    width: 120px;
}
</style>

<script src="../turtlegui.js"></script>

<script>

// Controller code / state
var data = {
    saying: "A bird in the hand",
    x: 0,
    y: 0,
    highlight: false,
    set_coords: function() {
        // most browsers set the variable "event" in the event of an event.
        data.x = event.clientX;
        data.y = event.clientY;
        turtlegui.reload();
    },
    set_highlight: function(highlight) {
        data.highlight = highlight;
        turtlegui.reload();
    }
}

document.addEventListener("DOMContentLoaded", function(){
    // call turtlegui.reload() when the page loads
    turtlegui.reload();
});

</script>

<body>

<h2>Event Binding Example</h2>
<p>This example demonstrates using gui-bind-events to handle mousemove, mouseover, and mouseout events.</p>

<label>Type in the box and move your mouse over it:</label>
<br/><br/>
<input type="text" style="width: 200px; height: 200px; background-color: lightblue;"
 gui-val="data.saying"
 gui-change="turtlegui.reload()"
 gui-bind-events="mousemove=data.set_coords(); mouseover=data.set_highlight(true); mouseout=data.set_highlight(false)">
</input>

<div class="info-section">
    <div>
        <span class="info-label">Current text:</span>
        <span gui-text="data.saying"></span>
    </div>
    <div>
        <span class="info-label">Mouse X:</span>
        <span gui-text="data.x"></span>
    </div>
    <div>
        <span class="info-label">Mouse Y:</span>
        <span gui-text="data.y"></span>
    </div>
    <div>
        <span class="info-label">Mouse hovering:</span>
        <span gui-show="data.highlight">YES</span>
        <span gui-show="!data.highlight">NO</span>
    </div>
</div>

</body>
