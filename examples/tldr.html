<html>
<head>
    <title>TurtleGUI - Quick Start (TLDR)</title>
</head>

<script src="../turtlegui.js"></script>

<script>

var data = {
    sentence: "The quick brown fox jumped over the lazy dog"
}

document.addEventListener("DOMContentLoaded", function(){
    // call turtlegui.reload() when the page loads
    turtlegui.reload();
});

</script>

<body>

    <h2>TurtleGUI Quick Start</h2>
    <p>The simplest example: using gui-text to display data.</p>

    <div gui-text="data.sentence"></div>

</body>
